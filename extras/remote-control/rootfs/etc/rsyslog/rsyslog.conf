# ThinkSmart View: forward the (RAM-only) journal to the monitoring host; nothing is written locally.
# journald (ForwardToSyslog=yes) writes to /run/systemd/journal/syslog; Alpine's rsyslog has no imjournal.
global(workDirectory="/run/rsyslog")
module(load="imuxsock" SysSock.Use="off")
input(type="imuxsock" Socket="/run/systemd/journal/syslog" CreatePath="on")
# Plain UDP inside the LAN, queue in RAM if the monitoring host is briefly away.
# @MONITOR_HOST@ is replaced from .env (MONITOR_HOST) by setup-remote.sh.
action(type="omfwd" target="@MONITOR_HOST@" port="514" protocol="udp"
       template="RSYSLOG_TraditionalForwardFormat"
       queue.type="LinkedList" queue.size="2000" action.resumeRetryCount="-1")
