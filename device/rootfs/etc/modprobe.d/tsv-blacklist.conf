# ThinkSmart View kiosk: hardware it never uses.
# Bluetooth (QCA UART controller)
blacklist bluetooth
blacklist hci_uart
blacklist btqca
blacklist btbcm
install bluetooth /bin/false
# Accelerometer (no screen rotation on a fixed kiosk)
blacklist bmc150_accel_i2c
blacklist bmc150_accel_core
# Venus video codec: fails to probe on this kernel (-EIO) anyway
blacklist venus_core
